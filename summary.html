<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="summary.css">
    <script type="module" src="summary.js" defer></script>
    <title>Отчет</title>
</head>
<body>
    <template id="tr">
        <tr class="record">
            <td class="category"></td>
            <td class="plan"></td>
            <td class="fact"></td>
        </tr>
    </template>

    <template id="income">
        <tr class="income">
            <td class="category"></td>
            <td class="amount"></td>
        </tr>
    </template>

    <header>
        <div class="container">
            <a class="categories" href="settings.html"  title="Настройки">
                <img src="img/gear.png" alt="" width="25px" height="25px">
            </a>
            <h1>Отчёт</h1>
        </div>
    </header>

    <main>
        <div class="container"> 
            <table class="year-summary">
                <thead>
                    <tr class="year">
                        <td colspan="2">
                            <button class="prevYear"><</button>
                            <input type="number" name="year" step="1" min="1900" max="9999">
                            <button class="nextYear">></button>
                        </td>
                    </tr>
                </thead>

                <tbody>
                    

                    
                </tbody>
                <tfoot>
                    <tr class="result">
                        <td>Доходы</td>
                        <td class="amount">0</td>
                    </tr>
                    <tr class="expenses">
                        <td>Расходы</td>
                        <td class="amount">0</td>
                    </tr>
                    <tr class="balance">
                        <td>Баланс</td>
                        <td class="amount">0</td>
                    </tr>
                </tfoot>
            </table>

        </div>

        <div class="container flex-col" style="margin-top: 50px;">
            <div class="period">
                <input type="date" name="start"> - 
                <input type="date" name="end">
                <div class="toggle-month">
                    <button class="prev"><</button>
                    <button class="next">></button>
                </div>
            </div>
        </div>

        <div class="container flex-col">
            <table class="month-summary">
                <thead>
                    <tr class="head">
                        <td class="category">Категория</td>
                        <td class="plan">План</td>
                        <td class="fact">Факт</td>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </main>

     <footer>
        <div class="container">
            <nav>
               <ul class="links">
                    <li class="link" title="Добавить транзакцию">
                        <a href="index.html">
                            <img src="img/deposit.png" alt="" width="42" height="42">
                        </a>
                    </li>
                    <li class="link" title="Доходы">
                        <a href="incomes.html">
                            <img src="img/income.png" alt="" width="42" height="42">
                        </a>
                    </li>
                    <li class="link" title="Расходы">
                        <a href="expenses.html">
                            <img src="img/spending.png" alt="" width="42" height="42">
                        </a>
                    </li>
                    <li class="link" title="Бюджет">
                        <a href="budget.html">
                            <img src="img/budget.png" alt="" width="42" height="42">
                        </a>
                    </li>
                    <li class="link active" title="Отчет">
                        <a href="summary.html">
                            <img src="img/data-analysis.png" alt="" width="42" height="42">
                        </a>
                    </li>
                </ul>
        </div>
    </footer>
</body>
</html>
